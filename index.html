<style>
/* Layout: a field notebook for one instrument. The photo stays in view and the increment-core strip carries the years. */
:root {
  --bg: #E9EDE2; --surface: #F7F8F2; --sunk: #DEE3D5; --ink: #18241C; --muted: #566459; --line: #C9D0BF;
  --accent: #1F5A43; --on-accent: #F4F7EF;
  --good: #3E7D3A; --average: #9D9A85; --poor: #B5532A; --warn-bg: #F3E8CE; --warn-ink: #5E4610;
  --s1: #0A74AD; --s2: #C2571A; --s3: #6B4FA0; --s4: #3C8D40;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111913; --surface: #1B251E; --sunk: #0C130E; --ink: #E7ECDF; --muted: #9DAA9E; --line: #313D34;
  --accent: #8AC9A4; --on-accent: #0F1A13;
  --good: #79B964; --average: #7F8877; --poor: #E08A5A; --warn-bg: #3A2F14; --warn-ink: #F0DDA8;
  --s1: #2F9BD6; --s2: #DB7434; --s3: #9A7CDA; --s4: #58A85D; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #111913; --surface: #1B251E; --sunk: #0C130E; --ink: #E7ECDF; --muted: #9DAA9E; --line: #313D34;
  --accent: #8AC9A4; --on-accent: #0F1A13;
  --good: #79B964; --average: #7F8877; --poor: #E08A5A; --warn-bg: #3A2F14; --warn-ink: #F0DDA8;
  --s1: #2F9BD6; --s2: #DB7434; --s3: #9A7CDA; --s4: #58A85D; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.5 var(--body); }
h1, h2, h3, p { margin: 0; }
h1, h2 { font-family: var(--display); font-weight: 400; line-height: 1.15; text-wrap: balance; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin-inline: auto; width: 100%; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 10px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font: 400 1.3rem/1 var(--display); }
.brand svg { width: 28px; height: 28px; color: var(--accent); }
nav.tabs { display: flex; gap: 4px; }
nav.tabs a { padding: 8px 12px; min-height: 40px; display: inline-flex; align-items: center; border-radius: 6px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: .95rem; }
nav.tabs a:hover { color: var(--ink); background: var(--sunk); }
nav.tabs a[aria-current="page"] { color: var(--on-accent); background: var(--accent); }

main { padding-block: 24px 56px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.quiet { background: transparent; }
.btn[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.btn svg { width: 20px; height: 20px; flex: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.eyebrow { font: 500 .75rem/1.3 var(--data); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* Home */
.home { display: grid; gap: 32px; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; }
.home h1 { font-size: clamp(2.1rem, 5.5vw, 3.4rem); max-width: 14ch; }
.home .lead { margin-top: 14px; max-width: 46ch; font-size: 1.075rem; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.drop { margin-top: 20px; padding: 14px 16px; border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); font-size: .9rem; display: none; }
.drop.over { border-color: var(--accent); color: var(--ink); background: var(--surface); }
@media (hover: hover) and (pointer: fine) { .camera-only { display: none !important; } .drop { display: block; } }
.tips { margin: 26px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; max-width: 52ch; }
.tips li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: .95rem; }
.tips svg { width: 18px; height: 18px; margin-top: 3px; color: var(--accent); }
.sample { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.sample-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sample canvas { display: block; width: 100%; height: auto; border-radius: 4px; background: var(--sunk); }

/* Result */
.result { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 28px; align-items: start; }
.stage-col { position: sticky; top: 12px; display: grid; gap: 10px; min-width: 0; }
.stage { position: relative; line-height: 0; background: var(--sunk); border-radius: 6px; overflow: hidden; }
.stage canvas { display: block; width: 100%; height: auto; max-height: 72vh; object-fit: contain; }
.stage.picking canvas { cursor: crosshair; touch-action: none; }
.stage-hint { position: absolute; inset: auto 8px 8px 8px; padding: 8px 10px; font-size: .875rem; line-height: 1.35; color: #fff; background: rgba(10, 18, 13, .82); border-radius: 4px; }
.stage-tools { display: flex; flex-wrap: wrap; gap: 8px; }
.stage-tools .btn { min-height: 40px; padding: 6px 12px; font-size: .9rem; }
.data-col { display: grid; gap: 24px; min-width: 0; }
.age { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.age-num { font: 400 clamp(3.2rem, 9vw, 5rem)/1 var(--display); font-variant-numeric: tabular-nums; }
.age-unit { font: 400 1.4rem/1.2 var(--display); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: .85rem; font-weight: 600; background: var(--sunk); }
.chip svg { width: 14px; height: 14px; }
.chip.high svg { color: var(--good); } .chip.medium svg { color: var(--average); } .chip.low svg { color: var(--poor); }
.note { padding: 10px 12px; background: var(--warn-bg); color: var(--warn-ink); border-radius: 6px; font-size: .925rem; }
.notes { display: grid; gap: 8px; }
.panel { display: grid; gap: 10px; min-width: 0; }
.panel h2 { font-size: 1.25rem; }
.field-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.field { display: grid; gap: 4px; min-width: 0; flex: 1 1 140px; }
.field label { font-size: .85rem; font-weight: 600; }
.field input { min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); width: 100%; }
.field.year { flex: 0 1 130px; } .field.year input { font-family: var(--data); }

/* Growth chart and core strip */
.chart { position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font: 400 11px var(--data); fill: var(--muted); }
.tip { position: absolute; top: 0; z-index: 2; pointer-events: none; padding: 6px 9px; background: var(--ink); color: var(--bg); border-radius: 4px; font: 400 .78rem/1.35 var(--data); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 2px; display: inline-grid; place-items: center; font: 700 10px/1 var(--body); font-style: normal; color: #fff; }
.tally { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tally div { padding: 8px 10px; background: var(--surface); border-radius: 6px; display: grid; }
.tally b { font: 400 1.5rem/1.2 var(--display); font-variant-numeric: tabular-nums; }
details { border-top: 1px solid var(--line); padding-top: 10px; }
summary { cursor: pointer; font-weight: 600; min-height: 32px; }
.scroll { overflow-x: auto; max-height: 320px; overflow-y: auto; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-size: .875rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 600; background: var(--bg); position: sticky; top: 0; }
.decline h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); }
.progress { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }

/* Trees and compare */
.page-head { display: grid; gap: 6px; margin-bottom: 20px; }
.page-head h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); }
.tree-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.tree { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.tree img { width: 72px; height: 72px; object-fit: cover; border-radius: 4px; display: block; }
.tree h3 { font: 400 1.1rem/1.2 var(--display); overflow-wrap: anywhere; }
.tree-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tree-actions .btn { min-height: 38px; padding: 4px 10px; font-size: .875rem; }
.empty { padding: 28px 20px; background: var(--surface); border: 1px dashed var(--line); border-radius: 6px; display: grid; gap: 12px; justify-items: start; max-width: 60ch; }
.picks { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; max-width: 100%; overflow-wrap: anywhere; }
.pick input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.compare { display: grid; gap: 18px; }
.yearchips { display: flex; flex-wrap: wrap; gap: 6px; }
.yearchips span { font: 400 .85rem var(--data); padding: 2px 8px; background: var(--sunk); border-radius: 4px; }
footer.fine { margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; max-width: 70ch; }
@media (max-width: 860px) {
  .home, .result { grid-template-columns: minmax(0, 1fr); }
  .stage-col { position: static; }
  .stage canvas { max-height: 60vh; }
}
</style>

<script id="engine-src">
/* Heartwood ring engine. Pure JS, no DOM: analyze(rgba, w, h, opts) -> result.
   Pipeline: wood mask -> pith from ring orientation -> radial wedge profiles ->
   per-ray counts by 3 methods -> elastic stack of rays -> consensus + yearly curve. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.RingEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ---------- small numeric helpers ---------- */
  const TUNE = { sig: 0.08, merge: 0.3, prom: 0.15, floor: 0.3 };
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  function quantile(arr, q) {
    if (!arr.length) return NaN;
    const s = Array.from(arr).sort((a, b) => a - b);
    const p = clamp(q, 0, 1) * (s.length - 1), i = Math.floor(p), f = p - i;
    return i + 1 < s.length ? s[i] * (1 - f) + s[i + 1] * f : s[i];
  }
  const median = (a) => quantile(a, 0.5);
  function gaussKernel(sigma) {
    const r = Math.max(1, Math.ceil(sigma * 3)), k = new Float32Array(2 * r + 1);
    let sum = 0;
    for (let i = -r; i <= r; i++) { k[i + r] = Math.exp(-(i * i) / (2 * sigma * sigma)); sum += k[i + r]; }
    for (let i = 0; i < k.length; i++) k[i] /= sum;
    return { k, r };
  }
  /* Edge-renormalised 1D Gaussian, so profile ends do not ring. */
  function gauss1D(a, sigma) {
    const { k, r } = gaussKernel(sigma), n = a.length, out = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      let s = 0, w = 0;
      const lo = Math.max(0, i - r), hi = Math.min(n - 1, i + r);
      for (let j = lo; j <= hi; j++) { const kv = k[j - i + r]; s += a[j] * kv; w += kv; }
      out[i] = s / w;
    }
    return out;
  }
  function blur2D(src, w, h, sigma) {
    const { k, r } = gaussKernel(sigma), tmp = new Float32Array(w * h), out = new Float32Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let s = 0, ws = 0;
      for (let d = -r; d <= r; d++) { const xx = x + d; if (xx < 0 || xx >= w) continue; const kv = k[d + r]; s += src[y * w + xx] * kv; ws += kv; }
      tmp[y * w + x] = s / ws;
    }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let s = 0, ws = 0;
      for (let d = -r; d <= r; d++) { const yy = y + d; if (yy < 0 || yy >= h) continue; const kv = k[d + r]; s += tmp[yy * w + x] * kv; ws += kv; }
      out[y * w + x] = s / ws;
    }
    return out;
  }
  function boxDown(src, w, h, f) {
    const nw = Math.max(1, Math.floor(w / f)), nh = Math.max(1, Math.floor(h / f)), out = new Float32Array(nw * nh);
    for (let y = 0; y < nh; y++) for (let x = 0; x < nw; x++) {
      const x0 = Math.floor(x * f), x1 = Math.min(w, Math.floor((x + 1) * f)), y0 = Math.floor(y * f), y1 = Math.min(h, Math.floor((y + 1) * f));
      let s = 0, c = 0;
      for (let yy = y0; yy < y1; yy++) for (let xx = x0; xx < x1; xx++) { s += src[yy * w + xx]; c++; }
      out[y * nw + x] = c ? s / c : 0;
    }
    return { data: out, w: nw, h: nh };
  }
  const colorDist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);

  /* ---------- wood mask ---------- */
  function segmentWood(rgba, w, h, keep) {
    const f = Math.max(1, Math.max(w, h) / 256);
    const lw = Math.max(1, Math.floor(w / f)), lh = Math.max(1, Math.floor(h / f)), n = lw * lh;
    const R = new Float32Array(n), G = new Float32Array(n), B = new Float32Array(n);
    for (let y = 0; y < lh; y++) for (let x = 0; x < lw; x++) {
      const x0 = Math.floor(x * f), x1 = Math.max(x0 + 1, Math.floor((x + 1) * f)), y0 = Math.floor(y * f), y1 = Math.max(y0 + 1, Math.floor((y + 1) * f));
      let r = 0, g = 0, b = 0, c = 0;
      for (let yy = y0; yy < y1 && yy < h; yy++) for (let xx = x0; xx < x1 && xx < w; xx++) {
        const i = (yy * w + xx) * 4; r += rgba[i]; g += rgba[i + 1]; b += rgba[i + 2]; c++;
      }
      const i = y * lw + x; R[i] = r / (c || 1); G[i] = g / (c || 1); B[i] = b / (c || 1);
    }
    const centre = [[], [], []], border = [];
    for (let y = 0; y < lh; y++) for (let x = 0; x < lw; x++) {
      const i = y * lw + x;
      if (Math.abs(x - lw / 2) < lw * 0.15 && Math.abs(y - lh / 2) < lh * 0.15) { centre[0].push(R[i]); centre[1].push(G[i]); centre[2].push(B[i]); }
      if (x < 3 || y < 3 || x >= lw - 3 || y >= lh - 3) border.push([R[i], G[i], B[i]]);
    }
    const c = [median(centre[0]), median(centre[1]), median(centre[2])];

    // Up to 3 background colours from the frame border (k-means seeded by luminance).
    const lum = (p) => 0.3 * p[0] + 0.59 * p[1] + 0.11 * p[2];
    const sorted = border.slice().sort((a, b) => lum(a) - lum(b));
    let clusters = [0.17, 0.5, 0.83].map((q) => sorted[Math.floor(q * (sorted.length - 1))].slice());
    let counts = [0, 0, 0];
    for (let it = 0; it < 6; it++) {
      const sum = clusters.map(() => [0, 0, 0]); counts = [0, 0, 0];
      for (const p of border) {
        let best = 0, bd = Infinity;
        clusters.forEach((cl, k) => { const d = colorDist(p, cl); if (d < bd) { bd = d; best = k; } });
        counts[best]++; sum[best][0] += p[0]; sum[best][1] += p[1]; sum[best][2] += p[2];
      }
      clusters = clusters.map((cl, k) => (counts[k] ? [sum[k][0] / counts[k], sum[k][1] / counts[k], sum[k][2] / counts[k]] : cl));
    }
    const bg = clusters.filter((cl, k) => counts[k] > border.length * 0.08 && colorDist(cl, c) >= 26 && !(keep || []).some((m) => colorDist(cl, m) < 20));

    const full = () => ({ data: new Uint8Array(n).fill(1), w: lw, h: lh, scale: f, fullFrame: true, centreColor: c, bg: [] });
    if (!bg.length) return full();

    const cand = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      const p = [R[i], G[i], B[i]];
      for (const cl of bg) { if (colorDist(p, cl) < Math.max(18, 0.45 * colorDist(cl, c))) { cand[i] = 1; break; } }
    }
    // Flood the background inward from the border.
    const flooded = new Uint8Array(n), stack = [];
    for (let x = 0; x < lw; x++) { stack.push(x, (lh - 1) * lw + x); }
    for (let y = 0; y < lh; y++) { stack.push(y * lw, y * lw + lw - 1); }
    while (stack.length) {
      const i = stack.pop();
      if (flooded[i] || !cand[i]) continue;
      flooded[i] = 1;
      const x = i % lw, y = (i - x) / lw;
      if (x > 0) stack.push(i - 1); if (x < lw - 1) stack.push(i + 1);
      if (y > 0) stack.push(i - lw); if (y < lh - 1) stack.push(i + lw);
    }
    // Morphological opening of the background closes cracks that leak the flood into the wood.
    const rad = 2, eroded = new Uint8Array(n), opened = new Uint8Array(n);
    for (let y = 0; y < lh; y++) for (let x = 0; x < lw; x++) {
      let all = 1;
      for (let dy = -rad; dy <= rad && all; dy++) for (let dx = -rad; dx <= rad; dx++) {
        const xx = x + dx, yy = y + dy;
        if (xx < 0 || yy < 0 || xx >= lw || yy >= lh) continue;
        if (!flooded[yy * lw + xx]) { all = 0; break; }
      }
      eroded[y * lw + x] = all;
    }

      y.score = z > 0.6 ? 'good' : z < -0.6 ? 'poor' : 'average';
    }
  }

  /* ---------- top level ---------- */
  function decline(code, message, extra) {
    return Object.assign({ ok: false, code, message }, extra);
  }
  function analyze(rgba, w, h, opts) {
    opts = opts || {};
    const progress = opts.onProgress || function () {};
    const gray = new Float32Array(w * h);
    for (let i = 0, j = 0; i < gray.length; i++, j += 4) gray[i] = 0.3 * rgba[j] + 0.59 * rgba[j + 1] + 0.11 * rgba[j + 2];

    progress(0.05, 'Finding the wood');
    let mask = segmentWood(rgba, w, h);

    progress(0.15, 'Locating the pith');
    let field = orientationField(gray, w, h, mask);
    let centre, auto = true;
    if (opts.center) { centre = { x: opts.center.x, y: opts.center.y }; auto = false; }
    else if (field.tiles.length >= 12) { const p = locatePith(field); centre = { x: p.x * field.f, y: p.y * field.f }; }
    else centre = { x: w / 2, y: h / 2 };

    const woodLike = structuredBackground(rgba, w, h, gray, mask, centre);
    if (woodLike.length) {
      mask = segmentWood(rgba, w, h, woodLike);
      field = orientationField(gray, w, h, mask);
      if (auto && field.tiles.length >= 12) { const p = locatePith(field); centre = { x: p.x * field.f, y: p.y * field.f }; }
    }
    if (auto && field.tiles.length >= 12) {
      const fine = orientationField(gray, w, h, mask, 8, 1000);
      const p = refinePith(fine, { x: centre.x / fine.f, y: centre.y / fine.f });
      if (p.x >= 0 && p.y >= 0 && p.x * fine.f < w && p.y * fine.f < h) centre = { x: p.x * fine.f, y: p.y * fine.f };
    }
    const colourShare = woodColourShare(rgba, w, h, mask);
    const inFrame = centre.x >= 0 && centre.y >= 0 && centre.x < w && centre.y < h;
    const stats = fieldStats(field, centre.x / field.f, centre.y / field.f);
    const diag = { colourShare, radiality: stats.radiality, parallel: stats.parallel, coherence: stats.coherence, fullFrame: mask.fullFrame };
    const base = { centre, autoCentre: auto, width: w, height: h, diag };

    if (colourShare < 0.45) return decline('not-wood', "This doesn't look like cut wood. Photograph the flat, cut face of a trunk.", base);
    if (auto && !inFrame) return decline('no-centre', 'The rings do not curve around a centre in this photo. Include the middle of the trunk, or set the centre yourself.', base);
    if (stats.parallel > 0.82 && !opts.center) return decline('flat-board', 'The grain runs in one direction, like a plank. Rings need to be visible as circles around the centre.', base);
    if (stats.radiality < 0.22) return decline('not-rings', 'No circular rings found around a centre. Use a clean, square-on photo of the cut face, or set the centre yourself.', base);

    progress(0.25, 'Finding the edge of the trunk');
    let outline = trunkOutline(rgba, gray, w, h, mask, centre);
    if (outline && auto) {
      // The first centre saw bark and background too, so settle it using only the trunk.
      const inTrunk = clipMask(mask, outline), fine = orientationField(gray, w, h, inTrunk, 8, 1000);
      if (fine.tiles.length >= 12) {
        const p = refinePith(fine, { x: centre.x / fine.f, y: centre.y / fine.f });
        const nx = p.x * fine.f, ny = p.y * fine.f;
        if (nx >= 0 && ny >= 0 && nx < w && ny < h) {
          centre = { x: nx, y: ny }; base.centre = centre;
          outline = trunkOutline(rgba, gray, w, h, mask, centre) || outline;
        }
      }
    }
    diag.outline = !!outline;

    progress(0.3, 'Measuring along 48 directions');
    const N = 48, raw = [];
    for (let k = 0; k < N; k++) {
      const ray = castRay(gray, w, h, mask, centre.x, centre.y, (k / N) * Math.PI * 2, outline);
      if (ray) raw.push(ray);
    }
    if (raw.length < 8) return decline('too-small', 'Too little of the trunk is visible around the centre. Move back so the whole face fits.', base);
    const maxLen = Math.max(...raw.map((r) => r.len));
    const rays = [];
    for (const r of raw) {
      if (r.len < 0.35 * maxLen) continue;
      const end = outline ? r.len : barkTrim(r.mean, r.clipped);
      const start = 2;
      if (end - start < 24) continue;
      r.trimR = end;
      r.bp = bandpass(r.mean.subarray(start, end));
      const bl = bandpass(r.left.subarray(start, end)), br = bandpass(r.right.subarray(start, end));
      r.q = corr(bl, br);
      r.res = analyseProfile(r.bp);
      rays.push(r);
    }
    // A real pith has wood on every side. If most directions end almost at once, this is a fragment.
    const coverage = raw.filter((r) => r.len >= 0.35 * maxLen).length / N;
    diag.coverage = coverage;
    if (rays.length < 6) return decline('too-small', 'Too little of the trunk is visible around the centre. Move back so the whole face fits.', base);

    progress(0.55, 'Comparing ring-counting methods');
    const qMed = median(rays.map((r) => r.q));
    let use = rays.filter((r) => r.q >= qMed && r.res.valid > 0.15);
    if (use.length < 6) use = rays.slice().sort((a, b) => b.q - a.q).slice(0, Math.min(rays.length, 12));
    const qTop = median(use.map((r) => r.q));
    diag.quality = qTop;
    diag.usableRays = use.length;
    if (qTop < 0.18) return decline('unclear', 'The rings are not clear enough to count. Sand or wet the cut face, light it evenly, then try again.', base);

    progress(0.7, 'Lining up rings between directions');
    const L = Math.round(median(use.map((r) => r.bp.length)));
    const { stack, maps } = stackRays(use, L);
    let sRes = analyseProfile(stack);

    // Trace once, line the rings up along those traces, and count again on the much cleaner profile.
    let traced = null, P = null, line = null;
    const rawRadii = () => sRes.minima.map((b) => use.map((r) => (maps.get(r)[Math.min(L - 1, b)] / (L - 1)) * r.trimR + 2));
    if (outline && sRes.minima.length >= 2) {
      progress(0.76, 'Following each ring around the trunk');
      P = ringPolar(gray, w, h, centre, outline);
      const radius = median(Array.from(outline.radii));
      let spacing = Math.max(4, radius / Math.max(sRes.minima.length, 1));
      line = darkLines(P, spacing);
      traced = traceRings(P, line, outline, ringSeeds(rawRadii(), use.map((r) => r.angle), outline, P.nT), spacing);
      for (let pass = 0; pass < 2; pass++) {
        const st = straighten(P, traced, outline), res2 = analyseProfile(bandpass(st.stack));
        const was = traced.length, now = res2.minima.length;
        if (now <= was || now > 1.6 * was) break; // the cleaner profile may reveal faint rings, never remove traced ones
        const seeds = res2.minima.map((x) => Float32Array.from({ length: P.nT }, (_, t) => st.toPhoto(x, t)));
        for (let i = 1; i < seeds.length; i++) for (let t = 0; t < P.nT; t++) if (seeds[i][t] < seeds[i - 1][t] + 1) seeds[i][t] = seeds[i - 1][t] + 1;
        spacing = Math.max(4, radius / now);
        line = darkLines(P, spacing);
        traced = traceRings(P, line, outline, seeds, spacing * 0.8);
        sRes = res2;
      }
    }

    const mA = median(use.map((r) => r.res.a)), mB = median(use.map((r) => r.res.b)), mC = median(use.map((r) => r.res.c));
    const methods = { stacked: sRes.a, darkBands: mA, edges: mB, spacing: Math.round(mC) };
    // Edge counts split textured wood on real photos, so they only widen the range when they roughly agree.
    const counts = [sRes.a, mA, mC];
    if (Math.abs(mB - sRes.a) <= 0.25 * Math.max(sRes.a, 1)) counts.push(mB);
    const age = sRes.a;
    diag.methods = methods;
    const pxPerRing = sRes.per.length / Math.max(1, age);
    diag.pxPerRing = pxPerRing;

    if (age < 2) return decline('unclear', 'Could not separate individual rings. Try a sharper photo from closer in.', base);
    const hi = Math.max(...counts), lo = Math.min(...counts);
    const disagreement = (hi - lo) / Math.max(age, 1);
    diag.disagreement = disagreement;
    // Many more sharp edges than counted rings means faint rings were missed (a willow with 35 rings read as 5).
    const allHi = Math.max(hi, mB), allLo = Math.min(lo, mB);
    if ((allHi - allLo) / Math.max(age, 1) > 0.6) return decline('disagree', `The counting methods disagree too much to trust a number (${Math.round(allLo)} to ${Math.round(allHi)} rings). Try a sharper, evenly lit photo from closer in.`, base);
    if (pxPerRing < 3) return decline('too-fine', 'The rings are too fine for this photo. Take a closer or higher-resolution picture.', base);

    progress(0.85, 'Building the growth curve');
    const rayCounts = use.map((r) => r.res.a);
    const iqrLo = quantile(rayCounts, 0.25), iqrHi = quantile(rayCounts, 0.75);
    const low = Math.round(Math.min(age, Math.max(lo, iqrLo))), high = Math.round(Math.max(age, Math.min(hi, iqrHi)));
    const clippedShare = use.filter((r) => r.clipped).length / use.length;
    const years = traced ? yearsFromRings(traced, outline, line, P, age > traced.length) : buildYears(sRes.minima, use, maps, L, sRes.per);

    const overlay = traced
      ? { angles: Array.from({ length: P.nT }, (_, t) => (t / P.nT) * Math.PI * 2), rings: traced.map((r) => Array.from(r)) }
      : { angles: use.map((r) => r.angle), rings: rawRadii() };

    const spreadScore = 1 - clamp(disagreement / 0.45, 0, 1);
    const qualScore = clamp((qTop - 0.15) / 0.5, 0, 1);
    const radScore = clamp((stats.radiality - 0.2) / 0.5, 0, 1);
    const resScore = clamp((pxPerRing - 3) / 6, 0, 1);
    const confidence = 0.45 * spreadScore + 0.25 * qualScore + 0.15 * radScore + 0.15 * resScore;

    const outerPer = median(Array.from(sRes.per.subarray(Math.floor(sRes.per.length * 0.66))));
    diag.outerPer = outerPer;
    const tooFine = outerPer < 7;
    let highOut = high, levelOut = confidence >= 0.68 ? 'high' : confidence >= 0.42 ? 'medium' : 'low';
    if (tooFine) {
      highOut = Math.max(high, Math.round(age * (1 + ((7 - outerPer) / 7) * 2.5)));
      levelOut = outerPer < 5 ? 'low' : levelOut === 'high' ? 'medium' : levelOut;
    }
    const warnings = [];
    const partial = coverage < 0.7;
    if (partial) {
      levelOut = 'low';
      warnings.push('The centre of the tree does not seem to be surrounded by wood here, so this may be a fragment. Treat the number as a rough minimum and check the traced rings.');
    }
    if (tooFine) warnings.push('The outer rings are only a few pixels wide, so some may be merged and the real age may be higher. A closer photo of the outer edge will help.');
    if (clippedShare > 0.5) warnings.push('The outer edge is out of frame, so the tree may be older than this.');
    if (!auto) warnings.push('Using the centre you set by hand.');
    if (years.length && years.filter((y) => !y.reliable).length > years.length * 0.4) warnings.push('Many years could not be measured reliably, so they appear as gaps.');

    progress(1, 'Done');
    return Object.assign(base, {
      ok: true, age, low, high: highOut, confidence, level: levelOut, atLeast: tooFine || partial || clippedShare > 0.5, partial,
      methods, years, warnings, clipped: clippedShare > 0.5,
      overlay, trunk: outline ? { nT: outline.nT, radii: Array.from(outline.radii) } : null,
    });
  }

  return { analyze, version: 1, TUNE };
});

</script>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const view = $('#view');
const MAX_DIM = 2400, STORE = 'heartwood.trees.v1', THIS_YEAR = new Date().getFullYear();
const ICON = {
  camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.500"/></svg>',
  photo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><circle cx="8.500" cy="9.500" r="1.500"/><path d="m4 18 5-5 3 3 3-4 5 6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.500" aria-hidden="true"><path d="m5 13 4 4 10-11"/></svg>',
  dot: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="7"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2 21h20zM11 10h2v6h-2zm0 7h2v2h-2z"/></svg>',
};
const SCORE = { good: { label: 'Good', mark: '▲', v: 'var(--good)' }, average: { label: 'Average', mark: '', v: 'var(--average)' }, poor: { label: 'Poor', mark: '▼', v: 'var(--poor)' } };
const LEVEL = { high: ['High confidence', ICON.check], medium: ['Medium confidence', ICON.dot], low: ['Low confidence', ICON.alert] };
const SERIES = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)'];

/* ---------- storage: this device only ---------- */
function loadTrees() { try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch { return []; } }
function saveTrees(t) { try { localStorage.setItem(STORE, JSON.stringify(t)); return true; } catch { return false; } }
function loadCutYear() { try { return Number(localStorage.getItem('heartwood.cut')) || THIS_YEAR; } catch { return THIS_YEAR; } }

/* ---------- engine in a worker, falling back to this thread ---------- */
function runEngine(image, opts, onProgress) {
  return new Promise((resolve) => {
    const fallback = () => setTimeout(() => {
      resolve(RingEngine.analyze(image.data, image.width, image.height, Object.assign({}, opts)));
    }, 30);
    let worker;
    try {
      const code = $('#engine-src').textContent + `;self.onmessage=(e)=>{const{d,w,h,o}=e.data;postMessage({done:RingEngine.analyze(d,w,h,Object.assign({},o,{onProgress:(p,m)=>postMessage({p,m})}))})}`;
      worker = new Worker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
    } catch { return fallback(); }
    worker.onerror = () => { worker.terminate(); fallback(); };
    worker.onmessage = (e) => {
      if (e.data.done) { worker.terminate(); resolve(e.data.done); }
      else if (onProgress) onProgress(e.data.p, e.data.m);
    };
    worker.postMessage({ d: image.data, w: image.width, h: image.height, o: opts || {} });
  });
}

/* ---------- example disc, drawn here so the app can show itself without a photo ---------- */
function drawExampleDisc(size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d'), img = ctx.createImageData(size, size), YEARS = 38;
  let seed = 11; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const w = []; for (let i = 0; i < YEARS; i++) w.push((1.5 * Math.exp(-i / 22) + 0.55) * Math.max(0.45, 1 + 0.32 * Math.sin(i * 0.8) + 0.22 * Math.sin(i * 0.27 + 2) + 0.25 * (rnd() - 0.5)));
  const tot = w.reduce((a, b) => a + b), cum = [0]; w.forEach((v) => cum.push(cum[cum.length - 1] + v / tot));
  const cx = size * 0.53, cy = size * 0.47, R = size * 0.4;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const dx = x - cx, dy = y - cy, th = Math.atan2(dy, dx), u = Math.hypot(dx, dy) / (R * (1 + 0.06 * Math.sin(3 * th + 1) + 0.03 * Math.sin(5 * th)));
    let col;
    if (u > 1.06) col = [216, 220, 208];
    else if (u > 1) col = [66, 47, 34];
    else {
      let lo = 0, hi = YEARS; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= u) lo = m; else hi = m; }
      const ph = (u - cum[lo]) / (cum[lo + 1] - cum[lo]), v = 1 - 0.42 * Math.pow(ph, 3.5);
      const base = u < 0.62 ? [182, 130, 82] : [212, 170, 118];
      col = [base[0] * v, base[1] * v, base[2] * v];
    }
    const i = (y * size + x) * 4, n = (rnd() - 0.5) * 12;
    img.data[i] = col[0] + n; img.data[i + 1] = col[1] + n; img.data[i + 2] = col[2] + n; img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return { canvas: c, image: img };
}

/* ---------- ring overlay on the photo ---------- */
function drawStage(canvas, shot, res, opts = {}) {
  const dw = Math.min(1400, shot.canvas.width), f = dw / shot.canvas.width, dh = Math.round(shot.canvas.height * f);
  if (canvas.width !== dw || canvas.height !== dh) { canvas.width = dw; canvas.height = dh; }
  const ctx = canvas.getContext('2d');
  ctx.drawImage(shot.canvas, 0, 0, dw, dh);
  if (!res) return;
  const lw = Math.max(1, dw / 700);
  const cx = res.centre.x * f, cy = res.centre.y * f;
  if (res.overlay && opts.showRings !== false) {
    const rays = res.overlay.angles.map((a, k) => ({ a, k })).sort((p, q) => p.a - q.a);
    res.overlay.rings.forEach((ring, ri) => {
      const hit = opts.highlight === ri;
      const pts = rays.map(({ a, k }) => ({ a, x: cx + ring[k] * f * Math.cos(a), y: cy + ring[k] * f * Math.sin(a) }));
      ctx.beginPath();
      const closed = pts.length > 2 && (pts[0].a + Math.PI * 2 - pts[pts.length - 1].a) < 1.2;
      const n = pts.length;
      // Smooth through midpoints; lift the pen across wide directions with no measurement.
      for (let i = 0; i < (closed ? n : n - 1); i++) {
        const p = pts[i], q = pts[(i + 1) % n], gap = i + 1 < n ? q.a - p.a : q.a + Math.PI * 2 - p.a;
        const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
        if (i === 0 || gap > 1.2) ctx.moveTo(mx, my);
        else {
          const prevGap = p.a - pts[i - 1].a;
          if (prevGap > 1.2) ctx.moveTo(mx, my); else ctx.quadraticCurveTo(p.x, p.y, mx, my);
        }
      }
      if (closed && n > 1) { const a = pts[0], b = pts[1]; ctx.quadraticCurveTo(a.x, a.y, (a.x + b.x) / 2, (a.y + b.y) / 2); }
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(8,16,12,.55)'; ctx.lineWidth = (hit ? 4 : 2) * lw; ctx.stroke();
      ctx.strokeStyle = hit ? '#FFE45C' : 'rgba(125,249,230,.9)'; ctx.lineWidth = (hit ? 2.4 : 1) * lw; ctx.stroke();
    });
  }
  const s = 11 * lw;
  ctx.lineCap = 'round';
  for (const [col, wd] of [['rgba(8,16,12,.7)', 4.5 * lw], ['#FF3D6E', 2.2 * lw]]) {
    ctx.strokeStyle = col; ctx.lineWidth = wd; ctx.beginPath();
    ctx.moveTo(cx - s, cy); ctx.lineTo(cx + s, cy); ctx.moveTo(cx, cy - s); ctx.lineTo(cx, cy + s); ctx.stroke();
  }
}

/* ---------- growth chart + core strip, linked by a shared crosshair ---------- */
const yearLabel = (i, n, cut) => `≈${cut - (n - 1 - i)}`;
function growthChart(host, years, cut, onHover) {
  const n = years.length;
  host.innerHTML = '';
  const W = Math.max(280, host.clientWidth || 600), H = 212, L = 32, R = 8, T = 10, plotB = 146, stripT = 158, stripB = 186;
  const x = (i) => L + ((i + 0.5) / n) * (W - L - R);
  const cell = (W - L - R) / n, gapPx = cell > 4 ? 1 : 0;
  const vals = years.filter((y) => y.reliable).map((y) => y.width);
  const maxV = Math.max(1.5, ...vals) * 1.05, yy = (v) => plotB - (v / maxV) * (plotB - T);
  const tickV = maxV > 3 ? [0, 1, 2, 3] : maxV > 2 ? [0, 1, 2] : [0, 0.5, 1, 1.5];
  let lines = '', seg = '';
  for (let i = 0; i < n; i++) {
    const y = years[i];
    if (y.reliable) seg += `${seg ? 'L' : 'M'}${x(i).toFixed(1)} ${yy(y.width).toFixed(1)}`;
    else { if (seg) lines += `<path d="${seg}"/>`; seg = ''; }
  }
  if (seg) lines += `<path d="${seg}"/>`;
  let trend = '';
  years.forEach((y, i) => { trend += `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${yy(y.trend || 0).toFixed(1)}`; });
  const step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor((W - L) / 76))));
  let xt = '';
  for (let i = n - 1; i >= 0; i -= step) xt += `<text x="${x(i).toFixed(1)}" y="${stripB + 16}" text-anchor="middle">${yearLabel(i, n, cut)}</text>`;
  const pid = 'hatch' + Math.random().toString(36).slice(2, 7);
  const strip = years.map((y, i) => {
    const px = L + (i / n) * (W - L - R), fill = y.reliable && y.score ? SCORE[y.score].v : `url(#${pid})`;
    return `<rect x="${px.toFixed(2)}" y="${stripT}" width="${Math.max(0.5, cell - gapPx).toFixed(2)}" height="${stripB - stripT}" fill="${fill}"/>`;
  }).join('');
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Ring width and score for each of ${n} estimated years. The table below lists every value.">
    <defs><pattern id="${pid}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--sunk)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--muted)" stroke-width="1.500"/></pattern></defs>
    ${tickV.map((v) => `<line x1="${L}" x2="${W - R}" y1="${yy(v)}" y2="${yy(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${yy(v) + 4}" text-anchor="end">${v}×</text>`).join('')}
    <path d="${trend}" fill="none" stroke="var(--muted)" stroke-width="1.500" stroke-dasharray="3 4"/>
    <g fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">${lines}</g>
    ${strip}${xt}
    <line class="cross" x1="0" x2="0" y1="${T}" y2="${stripB}" stroke="var(--ink)" stroke-width="1" visibility="hidden"/>
  </svg><div class="tip" hidden></div>`;
  const svg = $('svg', host), cross = $('.cross', host), tip = $('.tip', host);
  const show = (ev) => {
    const b = svg.getBoundingClientRect(), px = ev.clientX - b.left;
    const i = Math.max(0, Math.min(n - 1, Math.floor(((px - L) / (W - L - R)) * n)));
    const y = years[i];
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
    const scoreText = y.reliable && y.score ? `${SCORE[y.score].mark} ${SCORE[y.score].label} · ${y.index.toFixed(2)}× trend` : 'Not reliably measured';

async function handleFile(file) {
  if (!file) return;
  if (file.type && !file.type.startsWith('image/')) return showFileError('That file is not an image. Choose a JPEG or PNG photo.');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
    const f = Math.min(1, MAX_DIM / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * f); c.height = Math.round(img.naturalHeight * f);
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, c.width, c.height);
    await measure({ canvas: c, image: ctx.getImageData(0, 0, c.width, c.height) }, {}, { name: (file.name || '').replace(/\.[^.]+$/, '') });
  } catch {
    showFileError('This photo could not be opened. HEIC files only open in some browsers, so try a JPEG or PNG copy.');
  } finally { URL.revokeObjectURL(url); }
}

}

  }).join('');
  const step = Math.max(1, Math.ceil(span / Math.max(2, Math.floor((W - L) / 70))));
  let xt = ''; for (let yr = y1; yr >= y0; yr -= step) xt += `<text x="${x(yr).toFixed(1)}" y="${H - 8}" text-anchor="middle">≈${yr}</text>`;
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Growth compared with trend by calendar year for ${picked.length} trees">
    ${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${yy(v)}" y2="${yy(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${yy(v) + 4}" text-anchor="end">${v}×</text>`).join('')}
    ${lines}${xt}<line class="cross" y1="${T}" y2="${H - B}" stroke="var(--ink)" visibility="hidden"/></svg><div class="tip" hidden></div>`;
  const svg = $('svg', host), cross = $('.cross', host), tip = $('.tip', host);
  const show = (ev) => {
    const b = svg.getBoundingClientRect(), yr = Math.round(y0 + ((ev.clientX - b.left - L) / (W - L - R)) * span), c = Math.max(y0, Math.min(y1, yr));
    cross.setAttribute('x1', x(c)); cross.setAttribute('x2', x(c)); cross.setAttribute('visibility', 'visible');
    tip.innerHTML = `≈${c}` + picked.map((t, k) => { const v = maps[k].get(c); return `<br>${esc(t.name.slice(0, 18))}: ${v ? v.index.toFixed(2) + '×' : 'no data'}`; }).join('');
    tip.hidden = false;
    tip.style.left = Math.max(0, Math.min(b.width - tip.offsetWidth, x(c) - tip.offsetWidth / 2)) + 'px';
  };
  svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); tip.hidden = true; });

  if (picked.length < 2) { find.innerHTML = ''; return; }
  const shared = { good: [], poor: [] }; let overlap = 0;
  for (let yr = y0; yr <= y1; yr++) {
    const here = maps.map((m) => m.get(yr));
    if (here.some((v) => !v)) continue;
    overlap++;
    for (const k of ['good', 'poor']) if (here.every((v) => v.score === k)) shared[k].push(yr);
  }
  const chips = (a) => (a.length ? `<div class="yearchips">${a.map((y) => `<span>≈${y}</span>`).join('')}</div>` : '<p class="small muted">None in common.</p>');
  find.innerHTML = overlap < 5
    ? '<p class="muted">These trees overlap by fewer than 5 measured years, so there is too little to compare. Check their cutting years.</p>'
    : `<h2>Shared by ${picked.length === 2 ? 'both' : `all ${picked.length}`} trees</h2><p class="small muted">${overlap} measured years overlap.</p>
       <h3 style="font-size:1rem;font-weight:600">▲ Good years</h3>${chips(shared.good)}<h3 style="font-size:1rem;font-weight:600">▼ Poor years</h3>${chips(shared.poor)}`;
}

/* ---------- routing and input ---------- */
function route() {
  const h = location.hash.slice(1);
  if (h === 'trees') renderTrees();
  else if (h === 'compare') renderCompare();
  else renderHome();
}
window.addEventListener('hashchange', route);
for (const id of ['file-camera', 'file-library']) {
  $('#' + id).addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (location.hash) history.replaceState(null, '', location.pathname); handleFile(f); });
}
window.addEventListener('dragover', (e) => { e.preventDefault(); const d = $('#drop'); if (d) d.classList.add('over'); });
window.addEventListener('dragleave', () => { const d = $('#drop'); if (d) d.classList.remove('over'); });
window.addEventListener('drop', (e) => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
window.addEventListener('paste', (e) => { const f = [...(e.clipboardData?.files || [])].find((x) => x.type.startsWith('image/')); if (f) handleFile(f); });
window.Heartwood = { handleFile };
route();
if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
